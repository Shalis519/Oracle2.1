openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Aether Oracle API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and birth data
  - name: forecast
    description: Daily synthesized forecast and feedback
  - name: activations
    description: Feng Shui activation events
  - name: systems
    description: Esoteric systems (Matrix of Destiny, Bazi, Feng Shui)
  - name: contacts
    description: Contacts and family tree
  - name: dreams
    description: Dream journal and interpretation
  - name: tasks
    description: Habit tracker tasks
  - name: travel
    description: Travel map
  - name: chat
    description: Global chat (Болталка)
  - name: journal
    description: Personal life journal (life events and health survey)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/natal-chart:
    post:
      operationId: computeNatalChart
      tags: [profile]
      summary: Compute and save natal chart from profile birth data
      responses:
        "200":
          description: Natal chart saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  chart:
                    type: object

  /journal:
    get:
      operationId: getJournal
      tags: [journal]
      summary: Get the current user's life journal
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
    put:
      operationId: updateJournal
      tags: [journal]
      summary: Update the current user's life journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalInput"
      responses:
        "200":
          description: Updated journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [forecast]
      summary: Combined home dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /forecast/today:
    get:
      operationId: getTodayForecast
      tags: [forecast]
      summary: Get today's synthesized forecast
      responses:
        "200":
          description: Today's forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyForecast"

  /activations/today:
    get:
      operationId: getTodayActivations
      tags: [activations]
      summary: Get Feng Shui activation events for today
      responses:
        "200":
          description: Today's activations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivations"

  /forecast/history:
    get:
      operationId: listForecasts
      tags: [forecast]
      summary: List past forecasts
      responses:
        "200":
          description: Forecast history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyForecast"

  /forecast/{id}/feedback:
    post:
      operationId: submitFeedback
      tags: [forecast]
      summary: Submit feedback on a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: Saved feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /matrix:
    get:
      operationId: getMatrix
      tags: [systems]
      summary: Get the user's Matrix of Destiny breakdown
      responses:
        "200":
          description: Personal matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalMatrix"

  /bazi:
    get:
      operationId: getBazi
      tags: [systems]
      summary: Get the user's Bazi (Four Pillars) breakdown
      responses:
        "200":
          description: Bazi summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaziSummary"

  /peach-blossom:
    get:
      operationId: getPeachBlossom
      tags: [systems]
      summary: Get the user's Peach Blossom (桃花) reading and 30-day activation days
      responses:
        "200":
          description: Peach Blossom summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeachBlossomSummary"

  /fengshui:
    get:
      operationId: getFengShui
      tags: [systems]
      summary: Get the flying star for the user's bed direction
      responses:
        "200":
          description: Feng shui info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FengShuiInfo"

  /qimen:
    get:
      operationId: getQimen
      tags: [systems]
      summary: Get personal Qi Men Dun Jia walk structures for the coming days
      responses:
        "200":
          description: Personal Qi Men structures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QimenSummary"

  /cities/search:
    get:
      operationId: searchCities
      tags: [systems]
      summary: Search the offline world city database for the hour calculator
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching cities (most populous first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"

  /bazi/hours:
    post:
      operationId: computeBaziHours
      tags: [systems]
      summary: Compute Chinese double-hours (solar / rubber / combined) for a place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaziHoursInput"
      responses:
        "200":
          description: Hour tables for the three time variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaziHoursResult"

  /astrology/natal:
    get:
      operationId: getNatalChart
      tags: [systems]
      summary: Compute the user's western natal chart (Placidus, tropical)
      responses:
        "200":
          description: Natal chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NatalChart"
        "400":
          description: Missing birth data (date, time or coordinates)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /astrology/predictive-formula:
    post:
      operationId: calculatePredictiveFormula
      tags: [systems]
      summary: Calculate a selected predictive astrology formula on demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictiveFormulaInput"
      responses:
        "200":
          description: Predictive formula result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarriageFormulaResult"
        "400":
          description: Missing birth data or unsupported formula
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /astrology/money-formula:
    post:
      operationId: calculateMoneyFormula
      tags: [systems]
      summary: Calculate natal money-house formula on demand
      responses:
        "200":
          description: Money formula result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyFormulaResult"
        "400":
          description: Missing birth data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/birthdays:
    get:
      operationId: listUpcomingBirthdays
      tags: [contacts]
      summary: Upcoming contact birthdays within 7 days
      responses:
        "200":
          description: Upcoming birthdays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBirthday"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contacts/{id}/synastry:
    post:
      operationId: calculateContactSynastry
      tags: [contacts]
      summary: Calculate and save synastry for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calculated synastry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynastryCalculationResponse"
        "422":
          description: Not enough birth data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /connections:
    get:
      operationId: listFamilyConnections
      tags: [contacts]
      summary: List family tree connections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyConnection"
    post:
      operationId: createFamilyConnection
      tags: [contacts]
      summary: Create a family tree connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyConnectionInput"
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyConnection"

  /connections/{id}:
    delete:
      operationId: deleteFamilyConnection
      tags: [contacts]
      summary: Delete a family tree connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dreams:
    get:
      operationId: listDreams
      tags: [dreams]
      summary: List dream journal entries
      responses:
        "200":
          description: Dreams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dream"
    post:
      operationId: createDream
      tags: [dreams]
      summary: Record a dream and get an interpretation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DreamInput"
      responses:
        "201":
          description: Created dream with interpretation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dream"

  /dreams/{id}:
    delete:
      operationId: deleteDream
      tags: [dreams]
      summary: Delete a dream entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /psychology/practices:
    get:
      operationId: listPsychologyPractices
      tags: [psychology]
      summary: List published psychology practices
      responses:
        "200":
          description: Published practices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PsychologyPractice"

  /psychology/reflections:
    get:
      operationId: listPsychologyReflections
      tags: [psychology]
      summary: List the current user's psychology reflections
      responses:
        "200":
          description: Private reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PsychologyReflection"
    post:
      operationId: createPsychologyReflection
      tags: [psychology]
      summary: Save a private psychology reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologyReflectionInput"
      responses:
        "201":
          description: Created reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologyReflection"

  /psychology/reflections/{id}:
    put:
      operationId: updatePsychologyReflection
      tags: [psychology]
      summary: Update a private psychology reflection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologyReflectionInput"
      responses:
        "200":
          description: Updated reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologyReflection"
    delete:
      operationId: deletePsychologyReflection
      tags: [psychology]
      summary: Delete a private psychology reflection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/psychology/practices:
    get:
      operationId: listAdminPsychologyPractices
      tags: [admin]
      summary: List all psychology practices for administration
      responses:
        "200":
          description: Practices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PsychologyPractice"
    post:
      operationId: createAdminPsychologyPractice
      tags: [admin]
      summary: Create a psychology practice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologyPracticeInput"
      responses:
        "201":
          description: Created practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologyPractice"

  /admin/psychology/practices/{id}:
    put:
      operationId: updateAdminPsychologyPractice
      tags: [admin]
      summary: Update a psychology practice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologyPracticeInput"
      responses:
        "200":
          description: Updated practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologyPractice"
    delete:
      operationId: deleteAdminPsychologyPractice
      tags: [admin]
      summary: Delete a psychology practice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List habit tasks for a date
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a habit task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a habit task progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /notepad/reconcile:
    post:
      operationId: reconcileNotepad
      tags: [notepad]
      summary: Reconcile automatic reminders for today
      responses:
        "204":
          description: Automatic reminders reconciled

  /notepad/today:
    get:
      operationId: getNotepad
      tags: [notepad]
      summary: Today's notepad items (read-only)

      responses:
        "200":
          description: Notepad items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotepadItem"

  /notepad:
    post:
      operationId: createNotepadItem
      tags: [notepad]
      summary: Add a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotepadInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotepadItem"

  /notepad/{id}:
    patch:
      operationId: updateNotepadItem
      tags: [notepad]
      summary: Toggle done or edit a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotepadUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotepadItem"
    delete:
      operationId: deleteNotepadItem
      tags: [notepad]
      summary: Delete a personal note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /travels:
    get:
      operationId: listTravels
      tags: [travel]
      summary: List travel markers
      responses:
        "200":
          description: Travels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Travel"
    post:
      operationId: createTravel
      tags: [travel]
      summary: Mark a country as visited or wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelInput"
      responses:
        "201":
          description: Created travel marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Travel"

  /travels/stats:
    get:
      operationId: getTravelStats
      tags: [travel]
      summary: Travel counts
      responses:
        "200":
          description: Travel stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelStats"

  /travels/{id}:
    patch:
      operationId: updateTravel
      tags: [travel]
      summary: Update a travel marker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelUpdate"
      responses:
        "200":
          description: Updated travel marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Travel"
    delete:
      operationId: deleteTravel
      tags: [travel]
      summary: Delete a travel marker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/users/statistics:
    get:
      operationId: getAdminUserStatistics
      tags: [admin]
      summary: Get aggregate registered user statistics
      responses:
        "200":
          description: Aggregate user statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStatistics"

  /chat/unread:
    get:
      operationId: getChatUnread
      tags: [chat]
      summary: Get unread global chat message count
      responses:
        "200":
          description: Unread chat count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUnreadResponse"

  /chat/read:
    post:
      operationId: markChatRead
      tags: [chat]
      summary: Mark global chat messages as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReadInput"
      responses:
        "200":
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUnreadResponse"

  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List global chat messages in chronological order
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Post a message to the global chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Created chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /admin/long-term-forecasts:
    get:
      operationId: listAdminLongTermForecasts
      tags: [admin-long-term-forecasts]
      summary: List saved long-term forecasts
      responses:
        "200":
          description: Saved forecasts
          content:
            application/json:
              schema:
                type: object
                required: [forecasts]
                properties:
                  forecasts:
                    type: array
                    items:
                      $ref: "#/components/schemas/LongTermForecast"
    post:
      operationId: createAdminLongTermForecast
      tags: [admin-long-term-forecasts]
      summary: Calculate and save a long-term forecast draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongTermForecastInput"
      responses:
        "201":
          description: Forecast draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermForecast"
  /admin/long-term-forecasts/calculate:
    post:
      operationId: calculateAdminLongTermForecast
      tags: [admin-long-term-forecasts]
      summary: Calculate a long-term forecast without saving text blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongTermForecastInput"
      responses:
        "200":
          description: Forecast calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermForecastCalculation"
  /admin/long-term-forecasts/{id}:
    get:
      operationId: getAdminLongTermForecast
      tags: [admin-long-term-forecasts]
      summary: Get a saved long-term forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermForecast"
    put:
      operationId: updateAdminLongTermForecast
      tags: [admin-long-term-forecasts]
      summary: Update editable long-term forecast blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongTermForecastUpdate"
      responses:
        "200":
          description: Updated forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermForecast"
  /admin/long-term-forecasts/{id}/export:
    get:
      operationId: exportAdminLongTermForecast
      tags: [admin-long-term-forecasts]
      summary: Export a saved forecast as DOCX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Word document
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

