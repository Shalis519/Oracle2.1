openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Aether Oracle API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and birth data
  - name: forecast
    description: Daily synthesized forecast and feedback
  - name: activations
    description: Feng Shui activation events
  - name: systems
    description: Esoteric systems (Matrix of Destiny, Bazi, Feng Shui)
  - name: contacts
    description: Contacts and family tree
  - name: dreams
    description: Dream journal and interpretation
  - name: tasks
    description: Habit tracker tasks
  - name: travel
    description: Travel map
  - name: chat
    description: Global chat (Болталка)
  - name: journal
    description: Personal life journal (life events and health survey)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/natal-chart:
    post:
      operationId: computeNatalChart
      tags: [profile]
      summary: Compute and save natal chart from profile birth data
      responses:
        "200":
          description: Natal chart saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  chart:
                    type: object

  /journal:
    get:
      operationId: getJournal
      tags: [journal]
      summary: Get the current user's life journal
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
    put:
      operationId: updateJournal
      tags: [journal]
      summary: Update the current user's life journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalInput"
      responses:
        "200":
          description: Updated journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [forecast]
      summary: Combined home dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /forecast/today:
    get:
      operationId: getTodayForecast
      tags: [forecast]
      summary: Get today's synthesized forecast
      responses:
        "200":
          description: Today's forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyForecast"

  /activations/today:
    get:
      operationId: getTodayActivations
      tags: [activations]
      summary: Get Feng Shui activation events for today
      responses:
        "200":
          description: Today's activations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivations"

  /forecast/history:
    get:
      operationId: listForecasts
      tags: [forecast]
      summary: List past forecasts
      responses:
        "200":
          description: Forecast history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyForecast"

  /forecast/{id}/feedback:
    post:
      operationId: submitFeedback
      tags: [forecast]
      summary: Submit feedback on a forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: Saved feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /matrix:
    get:
      operationId: getMatrix
      tags: [systems]
      summary: Get the user's Matrix of Destiny breakdown
      responses:
        "200":
          description: Personal matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalMatrix"

  /bazi:
    get:
      operationId: getBazi
      tags: [systems]
      summary: Get the user's Bazi (Four Pillars) breakdown
      responses:
        "200":
          description: Bazi summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaziSummary"

  /peach-blossom:
    get:
      operationId: getPeachBlossom
      tags: [systems]
      summary: Get the user's Peach Blossom (桃花) reading and 30-day activation days
      responses:
        "200":
          description: Peach Blossom summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeachBlossomSummary"

  /fengshui:
    get:
      operationId: getFengShui
      tags: [systems]
      summary: Get the flying star for the user's bed direction
      responses:
        "200":
          description: Feng shui info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FengShuiInfo"

  /qimen:
    get:
      operationId: getQimen
      tags: [systems]
      summary: Get personal Qi Men Dun Jia walk structures for the coming days
      responses:
        "200":
          description: Personal Qi Men structures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QimenSummary"

  /cities/search:
    get:
      operationId: searchCities
      tags: [systems]
      summary: Search the offline world city database for the hour calculator
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching cities (most populous first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"

  /bazi/hours:
    post:
      operationId: computeBaziHours
      tags: [systems]
      summary: Compute Chinese double-hours (solar / rubber / combined) for a place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaziHoursInput"
      responses:
        "200":
          description: Hour tables for the three time variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaziHoursResult"

  /astrology/natal:
    get:
      operationId: getNatalChart
      tags: [systems]
      summary: Compute the user's western natal chart (Placidus, tropical)
      responses:
        "200":
          description: Natal chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NatalChart"
        "400":
          description: Missing birth data (date, time or coordinates)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/birthdays:
    get:
      operationId: listUpcomingBirthdays
      tags: [contacts]
      summary: Upcoming contact birthdays within 7 days
      responses:
        "200":
          description: Upcoming birthdays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBirthday"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /connections:
    get:
      operationId: listFamilyConnections
      tags: [contacts]
      summary: List family tree connections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyConnection"
    post:
      operationId: createFamilyConnection
      tags: [contacts]
      summary: Create a family tree connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyConnectionInput"
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyConnection"

  /connections/{id}:
    delete:
      operationId: deleteFamilyConnection
      tags: [contacts]
      summary: Delete a family tree connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dreams:
    get:
      operationId: listDreams
      tags: [dreams]
      summary: List dream journal entries
      responses:
        "200":
          description: Dreams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dream"
    post:
      operationId: createDream
      tags: [dreams]
      summary: Record a dream and get an interpretation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DreamInput"
      responses:
        "201":
          description: Created dream with interpretation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dream"

  /dreams/{id}:
    delete:
      operationId: deleteDream
      tags: [dreams]
      summary: Delete a dream entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List habit tasks for a date
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a habit task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a habit task progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /notepad/today:
    get:
      operationId: getNotepad
      tags: [notepad]
      summary: Today's notepad items (auto reminders reconciled + personal notes)
      responses:
        "200":
          description: Notepad items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotepadItem"

  /notepad:
    post:
      operationId: createNotepadItem
      tags: [notepad]
      summary: Add a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotepadInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotepadItem"

  /notepad/{id}:
    patch:
      operationId: updateNotepadItem
      tags: [notepad]
      summary: Toggle done or edit a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotepadUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotepadItem"
    delete:
      operationId: deleteNotepadItem
      tags: [notepad]
      summary: Delete a personal note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /travels:
    get:
      operationId: listTravels
      tags: [travel]
      summary: List travel markers
      responses:
        "200":
          description: Travels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Travel"
    post:
      operationId: createTravel
      tags: [travel]
      summary: Mark a country as visited or wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelInput"
      responses:
        "201":
          description: Created travel marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Travel"

  /travels/stats:
    get:
      operationId: getTravelStats
      tags: [travel]
      summary: Travel counts
      responses:
        "200":
          description: Travel stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelStats"

  /travels/{id}:
    patch:
      operationId: updateTravel
      tags: [travel]
      summary: Update a travel marker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelUpdate"
      responses:
        "200":
          description: Updated travel marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Travel"
    delete:
      operationId: deleteTravel
      tags: [travel]
      summary: Delete a travel marker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List global chat messages in chronological order
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Post a message to the global chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Created chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    City:
      type: object
      required: [name, country, lat, lng, timezone]
      properties:
        name:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
        timezone:
          type: string

    BaziHoursInput:
      type: object
      required: [lat, lng, utcOffset, date, doubledRat]
      properties:
        lat:
          type: number
        lng:
          type: number
        utcOffset:
          type: number
        date:
          type: string
        doubledRat:
          type: boolean

    HourInterval:
      type: object
      required: [animal, start, end]
      properties:
        animal:
          type: string
        start:
          type: ["string", "null"]
        end:
          type: ["string", "null"]

    BaziHoursResult:
      type: object
      required: [sunrise, sunset, shiftMinutes, solar, rubber, combined]
      properties:
        sunrise:
          type: string
        sunset:
          type: string
        shiftMinutes:
          type: number
        solar:
          type: array
          items:
            $ref: "#/components/schemas/HourInterval"
        rubber:
          type: array
          items:
            $ref: "#/components/schemas/HourInterval"
        combined:
          type: array
          items:
            $ref: "#/components/schemas/HourInterval"

    Profile:
      type: object
      required: [id, name, notificationsEnabled, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: ["string", "null"]
        cityLatitude:
          type: ["number", "null"]
        cityLongitude:
          type: ["number", "null"]
        cityTimezone:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        birthTime:
          type: ["string", "null"]
        birthPlace:
          type: ["string", "null"]
        birthLatitude:
          type: ["number", "null"]
        birthLongitude:
          type: ["number", "null"]
        birthTimezone:
          type: ["string", "null"]
        photoPath:
          type: ["string", "null"]
        bedDirection:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
          enum: ["мужчина", "женщина"]
          description: Пол пользователя (мужчина или женщина)
        notificationsEnabled:
          type: boolean
        role:
          type: string
        createdAt:
          type: string

    ProfileInput:
      type: object
      properties:
        name:
          type: string
        city:
          type: ["string", "null"]
        cityLatitude:
          type: ["number", "null"]
        cityLongitude:
          type: ["number", "null"]
        cityTimezone:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        birthTime:
          type: ["string", "null"]
        birthPlace:
          type: ["string", "null"]
        birthLatitude:
          type: ["number", "null"]
        birthLongitude:
          type: ["number", "null"]
        birthTimezone:
          type: ["string", "null"]
        photoPath:
          type: ["string", "null"]
        bedDirection:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
          enum: ["мужчина", "женщина"]
          description: Пол пользователя (мужчина или женщина)
        notificationsEnabled:
          type: boolean

    ChildBirth:
      type: object
      required: [date]
      properties:
        date:
          type: string
        name:
          type: string

    Relocation:
      type: object
      required: [date, city]
      properties:
        date:
          type: string
        city:
          type: string

    JobChange:
      type: object
      required: [date, field]
      properties:
        date:
          type: string
        field:
          type: string

    Loss:
      type: object
      required: [date, who]
      properties:
        date:
          type: string
        who:
          type: string

    Marriage:
      type: object
      required: [date]
      properties:
        date:
          type: string
        divorceDate:
          type: string

    Journal:
      type: object
      required: [id, marriages, children, relocations, jobChanges, losses, createdAt, updatedAt]
      properties:
        id:
          type: integer
        marriageDate:
          type: ["string", "null"]
        divorceDate:
          type: ["string", "null"]
        marriages:
          type: array
          items:
            $ref: "#/components/schemas/Marriage"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildBirth"
        relocations:
          type: array
          items:
            $ref: "#/components/schemas/Relocation"
        jobChanges:
          type: array
          items:
            $ref: "#/components/schemas/JobChange"
        losses:
          type: array
          items:
            $ref: "#/components/schemas/Loss"
        heightCm:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]
        bloodType:
          type: ["string", "null"]
        chronicConditions:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        smoking:
          type: ["boolean", "null"]
        fears:
          type: ["string", "null"]
        lastMenstruationDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    JournalInput:
      type: object
      properties:
        marriageDate:
          type: ["string", "null"]
        divorceDate:
          type: ["string", "null"]
        marriages:
          type: array
          items:
            $ref: "#/components/schemas/Marriage"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildBirth"
        relocations:
          type: array
          items:
            $ref: "#/components/schemas/Relocation"
        jobChanges:
          type: array
          items:
            $ref: "#/components/schemas/JobChange"
        losses:
          type: array
          items:
            $ref: "#/components/schemas/Loss"
        heightCm:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]
        bloodType:
          type: ["string", "null"]
        chronicConditions:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        smoking:
          type: ["boolean", "null"]
        fears:
          type: ["string", "null"]
        lastMenstruationDate:
          type: ["string", "null"]

    ArcanaDetail:
      type: object
      required: [number, name, essence, pros, cons, herbs, oils, cocktail, health, energyChannels, nutrition]
      properties:
        number:
          type: integer
        name:
          type: string
        essence:
          type: string
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
        herbs:
          type: array
          items:
            type: string
        oils:
          type: array
          items:
            type: string
        cocktail:
          type: string
        health:
          type: string
        energyChannels:
          type: string
        nutrition:
          type: string

    ForecastMatrix:
      type: object
      required: [number, name, essence]
      properties:
        number:
          type: integer
        name:
          type: string
        essence:
          type: string

    BaziPillar:
      type: object
      required: [name, heavenlyStem, earthlyBranch, element]
      properties:
        name:
          type: string
        heavenlyStem:
          type: string
        earthlyBranch:
          type: string
        element:
          type: string

    BaziStar:
